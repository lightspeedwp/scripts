name: Playwright MCP Server & Test Automation

description: Ensure Playwright MCP server is running before Playwright tests. Auto-restart if stopped. Document setup and integration in README and instructions.

on:
  workflow_call:

jobs:
  playwright-mcp-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci

      - name: Start Playwright MCP server
        run: |
          chmod +x scripts/start-mcp-server.sh
          ./scripts/start-mcp-server.sh

      - name: Run Playwright tests
        run: |
          npx playwright test

      - name: Archive MCP server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mcp-server-log
          path: scripts/playwright-mcp-server.log

name: Playwright MCP Server Automation

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main

jobs:
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Start MCP server
        run: ./scripts/scripts/utility/start-mcp-server.sh
      - name: Health check MCP server
        run: ./scripts/scripts/utility/check-mcp-server-health.sh
      - name: Run Playwright MCP server tests
        run: npx playwright test scripts/scripts/testing/playwright-mcp-server.spec.ts
