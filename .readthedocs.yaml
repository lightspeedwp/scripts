# ============================================================================
# .readthedocs.yaml
# Purpose: Read the Docs build configuration for LightSpeed WP Scripts
# Reference: https://docs.readthedocs.io/en/stable/config-file/v2.html
# ============================================================================

version: 2

build:
  os: ubuntu-22.04           # Build environment OS
  tools:
    python: "3.11"           # Python version for docs

python:
  install:
    - requirements: docs/requirements.txt  # Install doc requirements

sphinx:
  configuration: docs/conf.py              # Sphinx config path
