name: Lint and Format

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint:js
      - run: sudo apt-get install -y shellcheck
      - run: npm run lint:sh
      - run: npm run format -- --check
