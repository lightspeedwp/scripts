###############################################################################
# .coderabbit.yml - CodeRabbit/Code Review Automation Configuration
#
# This file configures CodeRabbit review, lint, and automation settings for the
# LightSpeed WP scripts repository. It enforces status checks, auto-labeling,
# reviewer assignment, and path-based review instructions for all code, scripts,
# and documentation. See repo docs for governance and standards.
###############################################################################

# YAML language server schema for validation
# https://coderabbit.ai/integrations/coderabbit-overrides.v2.json
language: 'en'  # Review language

# Chat/auto-reply settings
chat:
    auto_reply: true  # Enable automatic chat replies

# Review and status check configuration
reviews:
    status_checks:
        required:
            - markdownlint  # Enforce markdownlint for docs
            - Run Tests     # Require all tests to pass
            - ShellCheck    # Require ShellCheck for shell scripts
            - Changelog     # Require changelog update
            - Release       # Require release workflow
    required_approvals: 2  # Require 2 approvals for PR merge

    # Auto-labeling rules for PRs/issues based on file paths
    auto_labels:
        enabled: true
        rules:

          # Shell script review (merged)
          - path: 'scripts/**/*.sh'
            instructions: |
                # Review shell scripts for:
                # - Header comments and metadata (name, description, usage, author, date)
                # - Error handling (set -euo pipefail)
                # - ShellCheck compliance
                # - Test coverage with Bats
                # - Security best practices (no unsafe eval, proper quoting)
                # - Documentation in README
                # - Naming conventions (kebab-case)
                # - Logging and output clarity
                # - Compatibility with macOS and Linux
                # - Maintainability and modularity
                # - Code style (indentation, quoting, comments)
                # - Edge case and error handling

          # JavaScript review
          - path: 'scripts/**/*.js'
            instructions: |
                # Review JS scripts for:
                # - ESLint compliance
                # - Modular structure
                # - Test coverage
                # - Documentation and usage examples

          # Python review
          - path: 'scripts/**/*.py'
            instructions: |
                # Review Python scripts for:
                # - PEP8 compliance
                # - Test coverage
                # - Inline documentation and docstrings

          # Workflow review (merged)
          - path: 'workflows/**/*.yml'
            instructions: |
                # Review workflows for:
                # - Linting and test enforcement
                # - Required status checks
                # - Use of verified Marketplace actions
                # - Documentation and maintainability
                # - Reusability, modularity, and error handling
                # - Status checks and approvals
                # - Integration with project automation scripts
                # - Branch/path filters and triggers

          # package.json review
          - path: 'scripts/package.json'
            instructions: |
              # Review package.json for automation dependencies:
              # - Ensure only necessary devDependencies are included (e.g., markdownlint-cli)
              # - Validate scripts for linting and testing are present and correct
              # - Check for security vulnerabilities in dependencies
              # - Confirm semantic versioning and proper separation of dev/prod dependencies

          # markdownlint config review
          - path: '**/.markdownlint.json'
            instructions: |
              # Review markdownlint configuration:
              # - Ensure rules enforce repo documentation standards
              # - Validate config is compatible with markdownlint-cli and CI workflows
              # - Confirm strict enforcement of code block language and heading structure
          # Utility function review
          - path: 'scripts/utility-functions.sh'
            instructions: |
              # Review utility functions for script automation:
              # - Ensure functions are modular, reusable, and well-documented
              # - Validate error handling and input validation
              # - Confirm functions are tested and used consistently across scripts
              # - Check for code style and maintainability

          # .github workflow review
          - path: '**/.github/workflows/*.yml'
            instructions: |
              # Review .github workflows for CI/CD:
              # - Ensure workflows enforce linting, testing, and release policies
              # - Validate status checks are required for merges
              # - Check for proper branch and path filters
              # - Confirm workflows are documented and maintainable
              # - Ensure workflows run markdownlint and test jobs as required checks

# Early access and auto-labeling (legacy/compatibility)

early_access: false

auto_labels:
  enabled: false
  rules: []

auto_assign:
  enabled: false
  users: []

auto_review:
  enabled: false
  reviewers: []
