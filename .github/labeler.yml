# Automated label configuration for PRs
# See: https://github.com/actions/labeler

# File path patterns for labeling PRs
scripts:
  - scripts/**/*.sh
  - scripts/**/*.bash
  - scripts/*/
  - scripts/maintenance/**
  - scripts/deployment/**
  - scripts/project/**
  - scripts/testing/**
  - scripts/utility/**

tests:
  - tests/**/*.bats
  - tests/**/*.sh
  - tests/**/*.ts
  - tests/**/*.js
  - tests/**/*.spec.*

github-workflow:
  - .github/workflows/**
  - .github/actions/**

workflows:
  - workflows/**

documentation:
  - "*.md"
  - "**/*.md"
  - docs/**

configuration:
  - .github/*.yml
  - .github/*.yaml
  - "*.json"
  - "*.yml"
  - "*.yaml"
  - .shellcheckrc
  - .eslintrc*
  - .prettierrc*
  - .markdownlint*

# Branch name patterns
client-delivery:
  - "client-delivery-*"
  - "client/*"
  - "clients/*"

product-development:
  - "product-dev-*"
  - "product/*"
  - "feature/*"

# Commit message patterns (PR title typically)
"size: small":
  - head-branch: "^.*$"
    title: "^(docs|chore|fix|style)(\(.+\))?: .*"

"size: medium":
  - head-branch: "^.*$" 
    title: "^(feat|refactor)(\(.+\))?: .*"

"size: large":
  - head-branch: "^.*$"
    title: "^(major|breaking|rewrite)(\(.+\))?: .*"
